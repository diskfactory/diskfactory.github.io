<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DiskFactory Project Editor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">DF</span>
          <div>
            <p class="eyebrow">LOCAL CONTENT TOOL</p>
            <h1>Project Editor</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="local-badge"><span></span> 127.0.0.1 전용</span>
          <button class="button ghost" id="reloadButton" type="button">원본 다시 불러오기</button>
          <button class="button secondary" id="saveDraftButton" type="button">초안 저장</button>
          <button class="button primary" id="applyButton" type="button">projects.ts에 반영</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <div class="sidebar-heading">
            <div>
              <p class="eyebrow">PROJECTS</p>
              <strong id="projectCount">0개</strong>
            </div>
            <button class="icon-button" id="addProjectButton" type="button" aria-label="새 프로젝트 추가">+</button>
          </div>
          <div class="project-list" id="projectList"></div>
          <div class="sidebar-note">
            <strong>안전한 편집 흐름</strong>
            <p>편집 내용은 먼저 브라우저 초안에 머뭅니다. 마지막 버튼을 누를 때만 실제 파일이 바뀝니다.</p>
          </div>
        </aside>

        <section class="editor" id="editor">
          <div class="loading-card">프로젝트 데이터를 불러오는 중…</div>
        </section>

        <aside class="preview-panel">
          <div class="preview-heading">
            <div>
              <p class="eyebrow">LIVE PREVIEW</p>
              <strong>사이트 카드</strong>
            </div>
            <select id="previewLocale" aria-label="미리보기 언어">
              <option value="ko">KO</option>
              <option value="en">EN</option>
              <option value="pt-BR">PT-BR</option>
            </select>
          </div>
          <div id="preview"></div>
          <div class="validation-card" id="validationCard">
            <div class="validation-title">
              <strong>데이터 검사</strong>
              <button class="text-button" id="validateButton" type="button">지금 검사</button>
            </div>
            <p id="validationSummary">편집하면 자동으로 초안이 저장됩니다.</p>
            <ul id="validationList"></ul>
          </div>
        </aside>
      </main>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <dialog class="asset-dialog" id="assetDialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">PUBLIC / IMAGES</p>
          <h2>이미지 선택</h2>
        </div>
        <button class="icon-button" id="closeAssetDialog" type="button" aria-label="닫기">×</button>
      </div>
      <input class="asset-search" id="assetSearch" type="search" placeholder="폴더 또는 파일명 검색" />
      <div class="asset-grid" id="assetGrid"></div>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
